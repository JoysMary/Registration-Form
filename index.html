<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <!--Tailwind CSS CDN-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-start justify-center pt-6">
    <div class="bg-white w-full max-w-md p-5 rounded-xl shadow-lg">

        <h1 class="text-2xl font-bold text-center text-gray-900 mb-6"> <i class="fa-solid fa-address-card"></i>
            Welcome! Create an Account</h1>

        <form id="registrationForm">


            <!--NAME-->
            <div class="mb-5">
                <label for="name" class="block font-medium text-gray-700 flex mb-1">Name</label>

                <input type="text" id="name" placeholder="Enter Your Name"
                    class="w-full px-4 py-2 border rounded-xl hover:outline-none hover:ring-2 hover:ring-blue-400">
                <p id="nameError" class="text-red-500 text-sm mt-1"></p>
            </div>

            <!--Email-->
            <div class="mb-4">
                <label for="email" class="block font-medium text-gray-700 flex mb-1">E-Mail</label>
                <input type="email" id="email" placeholder="Enter your Email"
                    class="w-full px-4 py-2 border rounded-xl hover:outline-none hover:ring-2 hover:ring-blue-400">
                <p id="emailError" class="text-red-500 text-sm mt-1"></p>

            </div>

            <!--Password-->
            <div class="mb-4">
                <label for="passsword" class="block font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 Characters"
                    class="w-full px-4 py-2 border rounded-xl hover:outline-none hover:ring-2 hover:ring-blue-400">
                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>

            </div>

            <!--Bio-->
            <div class="mb-4">
                <label for="bio" class="block font-medium text-gray-700 mb-1">Bio</label>
                <textarea id="bio" maxlength="200" rows="4" placeholder="Write Something about Yourself..."
                    class="w-full px-4 py-2 border rounded-xl hover:outline-none hover:ring-2 hover:ring-blue-400">
                </textarea>
                <div class="flex justify-between text-sm mt-1">
                    <p id="bioError" class="text-red-500"></p>
                    <p id="counter" class="text-gray-500">0/200 Characters</p>
                </div>

            </div>


            <!--Submit Button-->
            <button type="submit" id="submitBtn" disabled
                class="w-full bg-gray-600 text-white py-2 rounded-xl font-semibold hover:bg-blue-700 disabled:bg-black-400 disabled:curser-not-allowe">Submit</button>
            <p id="successMessage" class="text-green-600 text-center font-medium mt-4"></p>
        </form>
    </div>

    <script>
        // Get Elements
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const bioInput = document.getElementById("bio");

        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");
        const bioError = document.getElementById("bioError");

        const counter = document.getElementById("counter");
        const bioWarning = document.getElementById("bioWarning");

        const submitBtn = document.getElementById("submitBtn");
        const form = document.getElementById("registrationForm");
        const successMessage = document.getElementById("successMessage");


        // Validation Function
        function validateForm() {

            let nameValid = false;
            let emailValid = false;
            let passwordValid = false;
            let bioValid = false;


            // Name Validation
            if (nameInput.value.trim() === "") {

                nameError.textContent = "Name is required.";

            } else {

                nameError.textContent = "";
                nameValid = true;
            }


            // Email Validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailInput.value.trim() === "") {

                emailError.textContent = "Email is required.";

            } else if (!emailPattern.test(emailInput.value.trim())) {

                emailError.textContent = "Please enter a valid email.";

            } else {

                emailError.textContent = "";
                emailValid = true;
            }


            // Password Validation
            if (passwordInput.value.length === 0) {

                passwordError.textContent = "Password is required.";

            } else if (passwordInput.value.length < 6) {

                passwordError.textContent =
                    "Password must contain at least 6 characters.";

            } else {

                passwordError.textContent = "";
                passwordValid = true;
            }


            // Bio Validation
            if (bioInput.value.trim() === "") {

                bioError.textContent = "Bio is required.";

            } else {

                bioError.textContent = "";
                bioValid = true;
            }


            // Enable Button
            if (nameValid && emailValid && passwordValid && bioValid) {

                submitBtn.disabled = false;

            } else {

                submitBtn.disabled = true;
            }
        }


        // Real-time validation
        nameInput.addEventListener("input", validateForm);
        emailInput.addEventListener("input", validateForm);
        passwordInput.addEventListener("input", validateForm);
        bioInput.addEventListener("input", validateForm);


        // Bio Character Counter
        bioInput.addEventListener("input", function () {

            const currentLength = bioInput.value.length;

            counter.textContent = '0/ 200 Characters';


            // Warning when approaching limit
            if (currentLength >= 180) {

                bioWarning.textContent =
                    "Warning: You are reaching the 200-character limit.";

            } else {

                bioWarning.textContent = "";
            }
        });


        // Submit Event
        form.addEventListener("submit", function (event) {

            event.preventDefault();

            successMessage.textContent = "Your Account Created Successfully!";

            form.reset();

            counter.textContent = "0 / 200 Characters";

            bioWarning.textContent = "";

            submitBtn.disabled = true;
        });

    </script>
</body>

</html>
